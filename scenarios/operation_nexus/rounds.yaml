rounds:
  - number: 1
    title: "Individualmente, tudo parece normal"
    narrative: >
      A Vero Crédito identificou possíveis irregularidades em um lote recente de
      solicitações. Vocês têm recursos para aprofundar apenas três perfis. Escolham
      usando somente as informações individuais disponíveis.
    credits: 100
    unlocks: ["Person", "Application"]
    duration_seconds: 900
  - number: 2
    title: "Conectando os pontos"
    narrative: >
      Novas fontes de dados revelam dispositivos, telefones, e-mails, endereços e contas
      compartilhadas. Encontrem uma conexão relevante e decidam se ela é suspeita ou
      explicável.
    credits: 120
    unlocks: ["Device", "Phone", "Email", "IPAddress", "Address", "BankAccount"]
    duration_seconds: 1200
  - number: 3
    title: "Identidade e evidência semântica"
    narrative: >
      Inconsistências cadastrais e mensagens recuperadas entram no jogo. Formulem uma
      hipótese de identidade e encontrem a evidência que a sustenta.
    credits: 140
    unlocks: ["Message", "Evidence"]
    duration_seconds: 1200
  - number: 4
    title: "Seguindo o dinheiro"
    narrative: >
      Transações, uma empresa e um corretor completam o quadro. A acusação final depende
      de pessoas, mecanismo, fluxo de dinheiro e datas.
    credits: 160
    unlocks: ["Transaction", "Company", "Broker", "Document"]
    duration_seconds: 1500
