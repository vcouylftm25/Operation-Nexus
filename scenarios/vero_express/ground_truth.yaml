# QUARANTINED — loaded ONLY by domain/game/scoring.py. Must never enter a prompt,
# a tool result, or an API response before GAME_FINISHED (CONTRACT.md §0 rule 4).
#
# Roles (narrative, for the facilitator):
#   person_04 (Isabela Brandão) -> coordinator. Deliberately boring through phases 1-2:
#       best credit score of the cast, highest declared income, one bland approved loan
#       from BEFORE the investigated window, and only two graph edges (her application
#       and her own address). She is only reachable in phase 3, by two independent
#       paths that must be combined: (a) the money — account_03 -> account_05, and
#       evidence_03 ties account_05 + company_01 to her; (b) the messages — she is the
#       sender of message_01, message_04 and message_05, i.e. the person giving orders.
#   person_01 (Pedro Hyppolito) -> mule. The MOST connected node from phase 2 onward
#       (3 applications, shared device + address + phone + generic e-mail, two outgoing
#       money hops). The obvious, incomplete answer: he signed, he did not organise.
#   person_02 (Anderson Schott) -> mule. Entry point of the money trail; shares
#       device_01, address_01, phone_01 and email_01 with person_01.
#   person_03 (Fernando Martins) -> mule / cash-out. Last hop before the shell company:
#       every mule transfer converges on account_03, which then empties into account_05.
#
# designed_false_positives:
#   person_05 (Rodrigo Baroni)  - worst credit_score in the dataset (291) and zero
#       shared infrastructure with anyone. Cleared in phase 3 by evidence_05.
#       Lesson: a bad score measures default risk, not fraud.
#   person_06 (Daniel Santos)   - shares the public coworking IP (ip_02) with the mule
#       device (device_01) in phase 2. Cleared in phase 3 by evidence_02: ~40 unrelated
#       customers per day exit through that same NAT address.
#   person_07 (Victor Aarão)    - message_06 ("consegue pôr no seu nome?") reads as loan
#       fronting out of context. Cleared in phase 3 by message_07 plus evidence_04: it
#       is the CRV of a car he financed in his own name, transferred to his brother by a
#       registered despachante.
#   person_08 (Caio Ghinis)     - brother-in-law of person_02 via rel_049 plus a small
#       recurring transfer (transaction_09). Cleared in phase 3 by evidence_06: R$ 350
#       on the 5th of every month since March 2024, health-plan share.

fraudsters:
  - person_01   # Pedro Hyppolito (mule — the obvious, wrong-alone answer)
  - person_02   # Anderson Schott (mule — entry point of the money trail)
  - person_03   # Fernando Martins (mule / cash-out — converges the money)
  - person_04   # Isabela Brandão (coordinator)

coordinator: person_04

pattern: MULE_ACCOUNTS

key_relationships:
  - rel_015   # USED_DEVICE person_02 -> device_01 (the phase-2 discovery: one device, two CPFs)
  - rel_032   # RESIDES_AT person_02 -> address_01 (same apartment number as person_01)
  - rel_073   # TRANSFERRED_TO account_01 -> account_03 (mule money converges on the cash-out)
  - rel_074   # TRANSFERRED_TO account_02 -> account_03 (second mule, same destination)
  - rel_075   # TRANSFERRED_TO account_03 -> account_05 (cash-out empties into the shell company)
  - rel_051   # CONTROLLED_BY company_01 -> person_04 (the shell company answers to the coordinator)

designed_false_positives:
  - person_05   # Rodrigo Baroni (worst score, zero links — cleared by evidence_05)
  - person_06   # Daniel Santos (public coworking IP — cleared by evidence_02)
  - person_07   # Victor Aarão (message out of context — cleared by message_07 + evidence_04)
  - person_08   # Caio Ghinis (brother-in-law + small recurring transfer — cleared by evidence_06)

decoy_notes: >
  person_01 (Pedro Hyppolito) is the trap for teams that accuse by degree: from phase 2
  on he is the most connected node in the graph, but he is a mule who signed papers
  someone else assembled. Teams that stop at him lose the coordinator bonus.
  person_05 (Rodrigo Baroni) is the trap for teams that accuse by score: 291, the worst
  in the dataset, and not a single shared node with anyone — his own credit analysis
  says so out loud in phase 3.
  person_06 (Daniel Santos) is the trap for teams that treat every shared node as equal:
  a public NAT IP is not a shared device, and the network report quantifies exactly why.
  person_07 (Victor Aarão) is the trap for teams that read one message without reading
  the reply: message_06 alone sounds like loan fronting, message_07 and evidence_04
  show it is a car document transfer handled by a registered despachante.
  person_08 (Caio Ghinis) is the trap for teams that treat any family tie plus any money
  movement as complicity: R$ 350 a month since 2024 predates the whole scheme.
  Every one of the four designed false positives has an explicit, discoverable clearing
  document in phase 3 — accusing them is always a fair, avoidable mistake.
