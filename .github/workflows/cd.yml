name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  RESOURCE_GROUP: LFTM-HMG-RG-BR01
  ACR_NAME: opnexusacr
  ACR_URL: opnexusacr.azurecr.io
  API_IMAGE: operation-nexus-api
  API_APP: operation-nexus-api
  PG_SERVER: opnexus-pg
  API_URL: https://operation-nexus-api.victoriouscoast-2b393742.brazilsouth.azurecontainerapps.io
  WEB_URL: https://delightful-sky-0ab490c0f.7.azurestaticapps.net

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
      web: ${{ steps.set.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - '.github/workflows/cd.yml'
              - 'apps/api/**'
              - 'scenarios/**'
              - 'infra/docker/api.Dockerfile'
            web:
              - '.github/workflows/cd.yml'
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - name: Resolver flags
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    name: Build da API -> ACR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # O builder clássico do ACR não entende os cache mounts do BuildKit que o
      # Dockerfile usa, então a imagem é construída aqui e só empurrada para lá.
      - name: Autenticar no ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_URL }}/${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_URL }}/${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Migrações do Postgres
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # O Postgres só aceita conexões de IPs liberados, e o runner recebe um IP
      # novo a cada execução; a regra é criada aqui e removida no passo final.
      - name: Liberar IP do runner no firewall
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PG_SERVER" \
            --rule-name "gh-runner-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Aplicar migrações
        working-directory: apps/api
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: |
          uv sync --all-extras
          uv run alembic upgrade head

      - name: Revogar IP do runner
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PG_SERVER" \
            --rule-name "gh-runner-${{ github.run_id }}" \
            --yes --output none || true

  deploy-api:
    name: Deploy da API
    runs-on: ubuntu-latest
    needs: [build-api, migrate]
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar Container App
        run: |
          az containerapp update \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_URL/$API_IMAGE:${{ needs.build-api.outputs.image-tag }}" \
            --output none

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health" >/dev/null; then
              echo "API respondendo."
              exit 0
            fi
            sleep 10
          done
          echo "API não respondeu ao /health depois de 5 minutos."
          exit 1

  deploy-web:
    name: Deploy do frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_WS_URL: wss://operation-nexus-api.victoriouscoast-2b393742.brazilsouth.azurecontainerapps.io
          VITE_MOCK: "false"
        run: pnpm build

      - name: Publicar no Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
