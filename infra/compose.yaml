# Operation Nexus — dev stack
#
# Usage (see /Makefile for the friendly wrappers):
#   docker compose -f infra/compose.yaml --env-file .env --profile core up -d   # dbs only
#   docker compose -f infra/compose.yaml --env-file .env --profile full up -d   # everything
#
# Build context for api/web is the repo root (..), so Dockerfiles can COPY
# apps/api, apps/web and the pnpm workspace files. Secrets/config come from
# the root .env (see .env.example) with sane defaults for every value.
name: operation-nexus

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:2025-community
    profiles: ["core", "full"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nexus_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-nexus_dev_password} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    profiles: ["full"]
    env_file:
      - ../.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # In-container DNS names override the host-facing defaults from .env.
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus_dev_password}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    profiles: ["full"]
    env_file:
      - ../.env
    environment:
      # The browser talks to the api on the host-published port, not the
      # in-network service name.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_plugins:
